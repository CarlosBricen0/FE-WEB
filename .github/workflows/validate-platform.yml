name: Validate frontend with FE-React
on:
  pull_request:
  workflow_dispatch:
    inputs:
      components_ref:
        description: Published branch or commit in FE-React
        default: 4ac71915019eba6976cfcccc31da470c581b85e4
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: FE-WEB
      - uses: actions/checkout@v4
        with:
          repository: CarlosBricen0/FE-React
          ref: ${{ inputs.components_ref || '4ac71915019eba6976cfcccc31da470c581b85e4' }}
          path: FE-React
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: FE-React
      - run: npm run build:creator-css
        working-directory: FE-React
      - run: npm ci --no-install-links
        working-directory: FE-WEB
      - run: npm run typecheck
        working-directory: FE-WEB
      - run: npm run lint
        working-directory: FE-WEB
      - run: npm test
        working-directory: FE-WEB
      - run: npm run check:architecture
        working-directory: FE-WEB
      - run: npm run build
        working-directory: FE-WEB
