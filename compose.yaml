services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onlyhorse
      POSTGRES_PASSWORD: onlyhorse_local
      POSTGRES_DB: onlyhorse
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - onlyhorse_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onlyhorse']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  onlyhorse_data:
